services:
  # ---------------------------------------------------------------------------
  # 1. SOCLE D'INFRASTRUCTURE (Base de données, Broker, Data Lake)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: compose_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: orders_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d orders_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservices_net

  kafka:
    image: apache/kafka:latest
    container_name: compose_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5
    networks:
      - microservices_net

  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: compose_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - microservices_net

  # ---------------------------------------------------------------------------
  # 2. MICROSERVICES MÉTIERS (OLTP & OLAP)
  # ---------------------------------------------------------------------------
  order_service:
    build: ./services/order_service
    container_name: compose_order_service
    environment:
      DATABASE_URL: postgresql+asyncpg://user:password@postgres:5432/orders_db
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - microservices_net

  datalake_worker:
    build: ./services/datalake_worker
    container_name: compose_datalake_worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: orders_topic
      KAFKA_GROUP_ID: datalake_worker_group
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: orders-datalake
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - microservices_net

  # ---------------------------------------------------------------------------
  # 3. FRONTIÈRE RÉSEAU (API Gateway)
  # ---------------------------------------------------------------------------
  gateway:
    image: nginx:alpine
    container_name: compose_gateway
    ports:
      - "8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - order_service
    networks:
      - microservices_net

volumes:
  postgres_data:
  minio_data:

networks:
  microservices_net:
    driver: bridge