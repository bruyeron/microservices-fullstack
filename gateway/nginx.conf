events {
    worker_connections 1024;
}

http {
    # Définition du groupe de serveurs cibles (Upstream) pour le Order Service
    upstream order_service_upstream {
        # host.docker.internal permet au conteneur Nginx de joindre votre Uvicorn qui tourne sous Windows
        server host.docker.internal:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Point de contrôle de santé de la Gateway elle-même
        location /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status": "API Gateway is healthy"}';
        }

        # Routage de toutes les requêtes /api/orders vers le microservice Order Service
        location /api/orders {
            proxy_pass http://order_service_upstream/api/orders;

            # Transmission des métadonnées du client d'origine au microservice
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # En-tête personnalisé prouvant que la réponse est passée par la Gateway
            add_header X-API-Gateway "Nginx-Microservices-Gateway" always;
        }

        # Exposition optionnelle de la documentation Swagger via la Gateway
        location /docs {
            proxy_pass http://order_service_upstream/docs;
            proxy_set_header Host $host;
        }

        location /openapi.json {
            proxy_pass http://order_service_upstream/openapi.json;
            proxy_set_header Host $host;
        }
    }
}